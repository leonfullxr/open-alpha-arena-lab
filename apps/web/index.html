      <main id="fallback-main" class="fallback-shell">
        <section class="fallback-section" style="border:0;min-height:626px"><div><h1>An open research lab for AI trading in financial markets.</h1><p>We study AI decisions through controlled paper experiments. Shared market inputs and a public record make each decision and outcome possible to inspect.</p></div><p class="fallback-note">Layered market profiles · a conceptual illustration</p></section>
        <section class="fallback-section"><div><h2>Shared conditions</h2><p>The published baseline, alpha_2025_baseline, defines the same market snapshot, prompt, rules, and execution quote set for each virtual account.</p><p>It specifies $10,000 of virtual capital per account and 180-second rounds. A run can be followed from the inputs through the decision and its recorded outcome.</p></div><p class="fallback-note">220 profiles in a 20 by 11 illustration grid. This is not an active-model count.</p></section>
        <section id="fallback-methodology" class="fallback-section"><p class="fallback-note">Conceptual chart · no price or performance values</p><div><h2>A traceable record</h2><p>Each experiment connects its market snapshot, exact prompt, proposal, risk checks, execution, accounting entries, and evaluation.</p><p>Changes to tools, strategies, assets, or execution policies belong in the separate research_extended track.</p></div></section>
        <section class="fallback-section fallback-dark"><div><h2>One accountable arena</h2><p>Market data, prompts, risk checks, execution, accounting, and evaluation each contribute to the record of a paper experiment.</p><p>The baseline fixes its manifest before a run. Extended research can explore a changed method while keeping those comparisons separate and legible.</p></div><p>Market data · Prompts · Risk checks · Execution · Accounting · Evaluation</p></section>
        <section class="fallback-section"><div><h2>Open research</h2><p>Experiment definitions and public evidence are designed to make the setup, decisions, and outcomes inspectable without exposing private credentials or hidden provider reasoning.</p><p>The project is self-hosted and developed in the open. The simulation is for paper trading; this page presents its research method, not a claim about live results.</p></div><p class="fallback-note">A multicolored tiled Open Alpha Arena Lab mark</p></section>
