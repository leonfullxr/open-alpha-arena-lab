[project]
name = "open-alpha-arena-lab"
version = "0.1.0"
description = "Deterministic offline paper-trading arena API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "argon2-cffi>=23.1,<26",
  "PyJWT[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv]
package = false
